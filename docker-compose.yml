version: '3.8'
services:
  db:
    image: postgres:15
    container_name: dayflow-db
    environment:
      POSTGRES_USER: dayflow_user
      POSTGRES_PASSWORD: dayflow_password
      POSTGRES_DB: dayflow
    ports:
      - "5432:5432"
    volumes:
      - dayflow-data:/var/lib/postgresql/data

volumes:
  dayflow-data:
